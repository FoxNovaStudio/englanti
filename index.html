<title>Sanalistat</title>
<style>

*,*:before,*:after{box-sizing:inherit}

h1{font-size:26px;margin:4px 4px 14px}
h2{font-size:18px;margin:22px 4px 8px}
.wrap{overflow-x:auto}.grid{min-width:560px}
.head,.row{display:grid;grid-template-columns:1fr 1fr}
.head{background:var(--head);position:sticky;top:env(safe-area-inset-top,0px);z-index:2;align-items:center}
.head>div{display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:19px}

.cell span{border-radius:6px}
.cell.hid span{color:transparent;background:var(--mask);user-select:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.ic{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px}
button.ic:hover{background:rgba(0,0,0,.08)}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:24px;background:currentColor;opacity:.25;margin:0 4px}
.load{margin:0 0 6px;padding:12px 14px;background:var(--row);border-radius:10px}
.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;background:var(--head);padding:9px 16px;border-radius:8px;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px}
summary{cursor:pointer;margin-top:10px;font-size:15px}
textarea,input{font:15px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--mask);border-radius:8px;padding:9px 10px;max-width:100%}
textarea{width:100%;min-height:100px;margin-top:8px}
.form{margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.form input{width:150px}
#code{font-weight:700}
.item{display:grid;grid-template-columns:44px 90px 1fr auto;gap:8px;align-items:center;background:var(--row);border-top:2px solid var(--line);padding:6px 10px 6px 0}
.open{all:unset;cursor:pointer;display:contents}
.item .c{font-weight:700;font-size:20px;padding:10px 0}
.item .nm{padding:10px 0}.item small{display:block;opacity:.7}
.item .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#sync,#msg{font-size:14px;opacity:.75}
.note{font-size:14px;opacity:.7;margin:10px 4px 0}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);margin-top:14px;padding:10px 14px;background:var(--head);border-radius:10px;display:flex;flex-direction:column;gap:8px;z-index:3;box-shadow:0 0 0 2px var(--bg)}
.bar .btn,.bar .ic,.tb .ic{background:var(--row)}
.r .ic{background:var(--row)}
.bar span{font-weight:700;margin-right:auto}
.chk{width:22px;height:22px;accent-color:#0a7d78;margin:0 0 0 14px}
.h2r{display:flex;align-items:center;gap:12px}
.tq{background:var(--row);border-radius:10px;padding:14px 16px;margin:0 0 10px}
.tl{font-size:14px;opacity:.75;margin:0 0 6px}
.big{font-size:28px;font-weight:700;margin:4px 0 12px;overflow-wrap:anywhere}
.tin{width:100%;font-size:20px;padding:12px;margin-bottom:10px}
.fb{min-height:1.4em;font-weight:700;margin-bottom:10px}
.t-ok{color:var(--done)}.t-bad{color:#e0602a}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--focus)}
.tw{font-weight:700;margin-bottom:6px}

.dbox{background:var(--bg);color:var(--ink);border-radius:16px;padding:28px 26px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}
.dbox p{font-size:20px;font-weight:600;margin:0 0 22px;line-height:1.4}
#dbtn{display:flex;flex-direction:column;gap:10px}
.btn.lg{font-size:17px;padding:14px 20px;text-align:center}
.sr{position:absolute;left:-9999px}
@media (max-width:560px){.item{grid-template-columns:44px 70px 1fr}.item .a{grid-column:1/-1;justify-content:flex-start;padding-left:18px}}
</style></head><body><main>

 <div class="wrap"><div class="grid">
  <div class="head">
   <div><span id="n0">English</span> <button class="ic" id="hEn" title="Piilota / näytä englanti" aria-label="Piilota tai näytä englanti"><svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/><path d="M3 21 21 3"/></svg></button></div>
   <div class="tools">
    <span style="margin-right:auto;display:flex;align-items:center;gap:10px"><span id="n1">Finnish</span> <button class="ic" id="hFi" title="Piilota / näytä suomi" aria-label="Piilota tai näytä suomi"><svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/><path d="M3 21 21 3"/></svg></button></span>
   </div>
  </div>
  <div id="rows"></div>
 </div></div>
</section>

<section id="test" hidden>
 <div class="top"><button class="btn" id="tback">← Takaisin</button><strong id="ttl2"></strong></div>
 <div id="tbody"></div>
</section>
</main>
<div id="dlg" hidden><div class="dbox"><p id="dtxt"></p><div id="dbtn"></div></div></div>

<script>
var firebaseConfig={

};

   history.replaceState(null,"","#"+code)}

 $("cp").hidden=!online;
 home()}
$("cp").onclick=function(){var u=location.href;
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){msg("Linkki kopioitu.")},function(){prompt("Kopioi tämä linkki:",u)})};

/* ---------- etusivu ---------- */
function codeOf(d){return d.course+(d.chapter?"."+d.chapter:"")}
function nat(a,b){var x=String(a).split("."),y=String(b).split(".");
 for(var i=0;i<Math.max(x.length,y.length);i++){var p=x[i],r=y[i];if(p===undefined)return -1;if(r===undefined)return 1;
  var n=parseInt(p,10),m=parseInt(r,10);
  if(!isNaN(n)&&!isNaN(m)){if(n!==m)return n-m}else{var c=p.localeCompare(r);if(c)return c}}return 0}
function home(){
 $("prac").hidden=true;$("test").hidden=true;$("home").hidden=false;cur=null;
 updateBar();var g=$("groups");g.innerHTML="";
 var ids=Object.keys(docs).filter(function(i){return !docs[i].mix});
 if(!ids.length){var p=document.createElement("p");p.className="note";p.textContent="Ei vielä listoja. Lataa ensimmäinen CSV-tiedosto yllä.";g.appendChild(p);return}
 var tot=0;ids.forEach(function(i){tot+=docs[i].en.length});
 var ai=document.createElement("div");ai.className="item";ai.appendChild(document.createElement("span"));

 var asm=document.createElement("small");asm.textContent=tot+" sanaa";an.appendChild(asm);
 ao.appendChild(ac);ao.appendChild(an);ao.onclick=function(){openMix("",ids,"Kaikki sanat")};ai.appendChild(ao);g.appendChild(ai);
 var by={};ids.forEach(function(id){var c=docs[id].course||"";(by[c]=by[c]||[]).push(id)});
 Object.keys(by).sort(function(a,b){if(!a)return 1;if(!b)return -1;return nat(a,b)}).forEach(function(c){
  var h=document.createElement("h2");h.className="h2r";var ht=document.createElement("span");ht.textContent=c?"Kurssi "+c:"Ilman kurssia";h.appendChild(ht);
  var sb=document.createElement("button");sb.className="btn sm";var all=by[c].every(function(i){return sel[i]});sb.textContent=all?"Poista valinta":"Valitse kaikki";
  sb.onclick=function(){by[c].forEach(function(i){if(all)delete sel[i];else sel[i]=1});home()};h.appendChild(sb);
  var ob=document.createElement("button");ob.className="btn sm";ob.textContent="Avaa kaikki";ob.onclick=function(){openMix("",by[c],c?"Kurssi "+c:"Ilman kurssia")};h.appendChild(ob);g.appendChild(h);
  by[c].sort(function(a,b){return nat(docs[a].chapter||"",docs[b].chapter||"")}).forEach(function(id){
   var d=docs[id],it=document.createElement("div");it.className="item";
   var k=document.createElement("input");k.type="checkbox";k.className="chk";k.checked=!!sel[id];k.setAttribute("aria-label","Valitse "+(codeOf(d)||d.name));
   k.onchange=function(){if(k.checked)sel[id]=1;else delete sel[id];updateBar()};it.appendChild(k);
   var o=document.createElement("button");o.className="open";
   var cc=document.createElement("span");cc.className="c";cc.textContent=codeOf(d)||"–";
   var nm=document.createElement("span");nm.className="nm";nm.textContent=d.name||"";
   var sm=document.createElement("small");sm.textContent=d.en.length+" sanaa";nm.appendChild(sm);
   o.appendChild(cc);o.appendChild(nm);o.onclick=function(){openList(id)};it.appendChild(o);
   var a=document.createElement("div");a.className="a";
   var e=document.createElement("button");e.className="btn sm";e.textContent="Muokkaa tunnusta";e.onclick=function(){editForm(id)};
   var x=document.createElement("button");x.className="btn sm";x.textContent="Poista";
   x.onclick=function(){confirmBox("Poistetaanko lista "+(codeOf(d)||"")+" ("+d.en.length+" sanaa)?","Poista",function(){remove(id);home()})};
   a.appendChild(e);a.appendChild(x);
   it.appendChild(a);g.appendChild(it)})})}

/* ---------- valinta ja yhdistäminen ---------- */
var sel={};
function selIds(){return Object.keys(sel).filter(function(i){return docs[i]&&!docs[i].mix}).sort(function(a,b){var x=docs[a],y=docs[b];return (!x.course)-(!y.course)||nat(x.course||"",y.course||"")||nat(x.chapter||"",y.chapter||"")})}

function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function sortIds(a){return a.filter(function(i){return docs[i]&&!docs[i].mix}).sort(function(a,b){var x=docs[a],y=docs[b];return (!x.course)-(!y.course)||nat(x.course||"",y.course||"")||nat(x.chapter||"",y.chapter||"")})}

/* ---------- lataus ---------- */
function parse(text){
 text=text.replace(/^\uFEFF/,"");
 var first=text.split(/\r?\n/)[0]||"",d=";",best=-1;

  else if(ch=='"')qq=true;
  else if(ch===d){row.push(c);c=""}
  else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&text[i+1]=="\n")i++;row.push(c);c="";out.push(row);row=[]}
  else c+=ch}

var pending=null,editId=null;

 pending=list;editId=null;$("fc").value="";msg("");buildChapters();showForm()}

function readFile(f){return new Promise(function(res){var rd=new FileReader();
 rd.onload=function(){var txt;try{txt=new TextDecoder("utf-8",{fatal:true}).decode(rd.result)}catch(err){txt=new TextDecoder("windows-1252").decode(rd.result)}
  res({name:f.name.replace(/\.[^.]+$/,""),text:txt})};rd.readAsArrayBuffer(f)})}
$("pick").onclick=function(){$("file").click()};
$("file").onchange=function(e){var fs=Array.prototype.slice.call(e.target.files);e.target.value="";if(!fs.length)return;
 fs.sort(function(a,b){return a.name.localeCompare(b.name,"fi",{numeric:true})});
 Promise.all(fs.map(readFile)).then(stageMany)};
$("usePaste").onclick=function(){stageMany([{name:"Liitetty lista",text:$("paste").value}])};
$("cancel").onclick=function(){$("form").hidden=true;pending=null;editId=null;msg("")};
$("save").onclick=function(){
 var c=clean($("fc").value);
 if(!c){msg("Kurssi puuttuu.");$("fc").focus();return}
 var ins=$("fl").querySelectorAll("input");
 if(editId){var d=docs[editId];d.course=c;d.chapter=clean(ins[0].value);persist(editId)}
 else if(pending){pending.forEach(function(f,i){var id="l"+Date.now().toString(36)+i;
  docs[id]={course:c,chapter:clean(ins[i].value),name:"",en:f.en,fi:f.fi,n:f.n,order:null,hEn:[],hFi:[],cEn:false,cFi:false,ts:Date.now()};persist(id)})}
 $("form").hidden=true;pending=null;editId=null;$("paste").value="";msg("");home()};

/* ---------- harjoittelu ---------- */
var cur=null,rows=[],colHid=[false,false],tm=null;
function openList(id){
 var d=docs[id];cur=id;var n=d.en.length,ord=d.order&&d.order.length===n?d.order:null;
 if(!ord){ord=d.en.map(function(_,i){return i})}
 var hE={},hF={};(d.hEn||[]).forEach(function(i){hE[i]=1});(d.hFi||[]).forEach(function(i){hF[i]=1});
 rows=ord.map(function(i){return{i:i,h:[!!hE[i],!!hF[i]]}});colHid=[!!d.cEn,!!d.cFi];
 $("n0").textContent=d.n[0];$("n1").textContent=d.n[1];
 $("ttl").textContent=d.mix?d.name:(codeOf(d)||"")+"  "+(d.name||"");
 $("home").hidden=true;$("test").hidden=true;$("prac").hidden=false;window.scrollTo(0,0);render()}
function changed(){clearTimeout(tm);tm=setTimeout(flush,500)}
function flush(){if(!tm||!cur)return;clearTimeout(tm);tm=null;var d=docs[cur];
 d.order=rows.map(function(r){return r.i});
 d.hEn=rows.filter(function(r){return r.h[0]}).map(function(r){return r.i});
 d.hFi=rows.filter(function(r){return r.h[1]}).map(function(r){return r.i});
 d.cEn=colHid[0];d.cFi=colHid[1];d.ts=Date.now();persist(cur)}
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});
function render(){var d=docs[cur],box=$("rows");box.innerHTML="";
 rows.forEach(function(r){var el=document.createElement("div");el.className="row";
  [0,1].forEach(function(c){var b=document.createElement("button");b.className="cell"+(r.h[c]?" hid":"");
   var s=document.createElement("span");s.textContent=(c?d.fi:d.en)[r.i];b.appendChild(s);
   b.setAttribute("aria-pressed",r.h[c]?"true":"false");b.dataset.k=r.i+"-"+c;
   b.onclick=function(){r.h[c]=!r.h[c];render();var f=box.querySelector('[data-k="'+r.i+"-"+c+'"]');if(f)f.focus();changed()};
   el.appendChild(b)});box.appendChild(el)});updTgl()}
var EYE='<svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>',EYEX='<svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/><path d="M3 21 21 3"/></svg>';
function allHid(){return rows.length>0&&rows.every(function(r){return r.h[0]&&r.h[1]})}
function updTgl(){var t=$("tgl"),h=allHid();t.innerHTML=h?EYEX:EYE;t.title=h?"Näytä kaikki":"Piilota kaikki";t.setAttribute("aria-label",t.title)}
$("tgl").onclick=function(){var v=!allHid();colHid=[v,v];rows.forEach(function(r){r.h=[v,v]});render();changed()};
function setCol(c,v){colHid[c]=v;rows.forEach(function(r){r.h[c]=v});render();changed()}
$("hEn").onclick=function(){setCol(0,!colHid[0])};
$("hFi").onclick=function(){setCol(1,!colHid[1])};
$("shuf").onclick=function(){for(var i=rows.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=rows[i];rows[i]=rows[j];rows[j]=t}render();changed()};
$("abc").onclick=function(){var d=docs[cur];rows.sort(function(a,b){return d.en[a.i].localeCompare(d.en[b.i],"en")});render();changed()};
$("back").onclick=function(){flush();home()};
$("goShuf").onclick=function(){openMix("shuf")};$("goAbc").onclick=function(){openMix("abc")};$("clrSel").onclick=function(){sel={};home()};
/* ---------- ponnahdusikkuna ---------- */
function dialog(txt,btns){var d=$("dlg"),bx=$("dbtn");$("dtxt").textContent=txt;bx.innerHTML="";
 function close(){d.hidden=true;document.removeEventListener("keydown",key)}
 function key(e){if(e.key==="Escape")close()}
 btns.forEach(function(b){var x=el("button","btn lg",b.label);x.onclick=function(){close();if(b.fn)b.fn()};bx.appendChild(x)});
 var c=el("button","btn lg","Peruuta");c.onclick=close;bx.appendChild(c);
 d.onclick=function(e){if(e.target===d)close()};document.addEventListener("keydown",key);d.hidden=false;c.focus()}
function confirmBox(txt,yes,fn){dialog(txt,[{label:yes,fn:fn}])}

/* ---------- testi ---------- */
var tSetup=false,tcfg={dir:0,mode:0},tTm=null;
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function tnorm(x){return String(x).toLowerCase().replace(/\s+/g," ").replace(/[.!?]+$/,"").trim()}
function tok(g,exp){g=tnorm(g);if(!g)return false;if(g===tnorm(exp))return true;return exp.split(/[\/;]/).some(function(p){return tnorm(p)===g})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rng(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function dirOf(t,p){return t.dir===2?(t.dirs&&t.dirs[p]?1:0):t.dir}
function tQ(d,t,p){var i=t.order[p];return dirOf(t,p)?d.fi[i]:d.en[i]}
function tA(d,t,p){var i=t.order[p];return dirOf(t,p)?d.en[i]:d.fi[i]}
function tSave(now){clearTimeout(tTm);tTm=null;if(now){if(cur)persist(cur)}else tTm=setTimeout(function(){tTm=null;if(cur)persist(cur)},600)}
function tFlush(){if(tTm){clearTimeout(tTm);tTm=null;if(cur)persist(cur)}}
document.addEventListener("visibilitychange",function(){if(document.hidden)tFlush()});
function inputFor(v){var i=el("input","tin");i.type="text";i.value=v||"";["autocomplete:off","autocapitalize:off","autocorrect:off","spellcheck:false"].forEach(function(a){var k=a.split(":");i.setAttribute(k[0],k[1])});i.setAttribute("aria-label","Vastaus");return i}
function startTest(order){var d=docs[cur],a=[],r=[];order.forEach(function(){a.push("");r.push(-1)});
 var dirs=order.map(function(){return Math.random()<.5?0:1});
 d.test={dir:tcfg.dir,dirs:dirs,mode:tcfg.mode,order:order,pos:0,ans:a,res:r,done:false,ts:Date.now()};tSetup=false;tSave(true);renderTest()}
function openTest(){var d=docs[cur];
 if(d.test&&(!d.test.order||d.test.order.some(function(i){return i>=d.en.length})))d.test=null;
 tSetup=!d.test;$("prac").hidden=true;$("home").hidden=true;$("test").hidden=false;window.scrollTo(0,0);renderTest()}
function renderTest(){var d=docs[cur],b=$("tbody"),t=d.test;b.innerHTML="";$("ttl2").textContent=$("ttl").textContent;
 if(tSetup||!t)setupView(b,d);else if(t.done)resultView(b,d);else if(t.mode===0)oneView(b,d);else allView(b,d)}
function setupView(b,d){var t=d.test;
 if(t&&!t.done){var c=el("div","tq");c.appendChild(el("p","tl","Keskeneräinen testi: "+t.pos+" / "+t.order.length+" tehty."));
  var j=el("button","btn","Jatka");j.onclick=function(){tSetup=false;renderTest()};c.appendChild(j);b.appendChild(c)}
 var box=el("div","tq");box.appendChild(el("p","tl","Suunta"));var s1=el("div","seg");
 [d.n[0]+" → "+d.n[1],d.n[1]+" → "+d.n[0],"Sekaisin"].forEach(function(l,k){var x=el("button","btn",l);x.setAttribute("aria-pressed",tcfg.dir===k?"true":"false");x.onclick=function(){tcfg.dir=k;renderTest()};s1.appendChild(x)});
 box.appendChild(s1);box.appendChild(el("p","tl","Tapa"));var s2=el("div","seg");
 ["Yksi kerrallaan (Enter näyttää oikean vastauksen)","Kaikki kerralla (tarkistus lopuksi)"].forEach(function(l,k){var x=el("button","btn",l);x.setAttribute("aria-pressed",tcfg.mode===k?"true":"false");x.onclick=function(){tcfg.mode=k;renderTest()};s2.appendChild(x)});
 box.appendChild(s2);var go=el("button","btn","Aloita testi");go.onclick=function(){var go2=function(){startTest(shuf(rng(d.en.length)))};if(t&&!t.done)confirmBox("Keskeneräinen testi korvataan uudella. Aloitetaanko?","Aloita uusi testi",go2);else go2()};box.appendChild(go);b.appendChild(box)}
function wrongFlow(d,t){var wrong=[];t.res.forEach(function(r,p){if(r===0)wrong.push(t.order[p])});if(!wrong.length)return;
 var o=[[d.n[0]+" → "+d.n[1],0],[d.n[1]+" → "+d.n[0],1],["Sekaisin",2]];
 dialog("Aloitetaanko uusi testi vain väärin menneillä sanoilla ("+wrong.length+")? Nykyinen testi korvataan. Valitse kieli:",
  o.map(function(x){return{label:x[0],fn:function(){tcfg.dir=x[1];tcfg.mode=t.mode;startTest(shuf(wrong))}}}))}
function topRow(b,txt,t,showWrong){var h=el("div","r");h.style.marginBottom="10px";h.appendChild(el("span","tl",txt));
 var nb=el("button","btn sm","Aloita alusta");
 nb.onclick=function(){confirmBox("Aloitetaanko alusta? Vastaukset nollautuvat.","Kyllä, aloita alusta",function(){tcfg.dir=t.dir;tcfg.mode=t.mode;startTest(shuf(t.order))})};
 h.appendChild(nb);
 if(showWrong&&t.res.some(function(r){return r===0})){var wb=el("button","btn sm","Testaa väärät");wb.onclick=function(){wrongFlow(d0(),t)};h.appendChild(wb)}
 b.appendChild(h)}
function d0(){return docs[cur]}
function oneView(b,d){var t=d.test,n=t.order.length,p=t.pos,ok=t.res.filter(function(r){return r===1}).length;
 topRow(b,(p+1)+" / "+n+" · oikein "+ok,t,true);
 var c=el("div","tq"),checked=t.res[p]!==-1;c.appendChild(el("div","tl",d.n[dirOf(t,p)]));c.appendChild(el("div","big",tQ(d,t,p)));
 var inp=inputFor(t.ans[p]);inp.readOnly=checked;c.appendChild(inp);
 var fb=el("div","fb");if(checked){var g=t.res[p]===1;fb.textContent=g?"Oikein":"Väärin. Oikea vastaus: "+tA(d,t,p);fb.className="fb "+(g?"t-ok":"t-bad")}c.appendChild(fb);
 var go=el("button","btn",checked?(p+1>=n?"Valmis":"Seuraava"):"Tarkista");
 function act(){if(!checked){t.ans[p]=inp.value;t.res[p]=tok(inp.value,tA(d,t,p))?1:0}else if(p+1>=n)t.done=true;else t.pos=p+1;tSave(true);renderTest()}
 go.onclick=act;inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();act()}};
 c.appendChild(go);b.appendChild(c);inp.focus()}
function allView(b,d){var t=d.test,n=t.order.length,ins=[];
 var cnt=null;function upd(){cnt.textContent="Vastattu "+t.ans.filter(function(x){return String(x).trim()}).length+" / "+n}
 topRow(b,"",t);cnt=b.firstChild.firstChild;upd();
 function finish(){for(var p=0;p<n;p++)t.res[p]=tok(t.ans[p]||"",tA(d,t,p))?1:0;t.done=true;tSave(true);window.scrollTo(0,0);renderTest()}
 for(var p=0;p<n;p++){(function(p){var r=el("div","tq");r.appendChild(el("div","tl",d.n[dirOf(t,p)]));r.appendChild(el("div","tw",tQ(d,t,p)));var i=inputFor(t.ans[p]);
  i.oninput=function(){t.ans[p]=i.value;upd();tSave(false)};
  i.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();if(ins[p+1])ins[p+1].focus();else finish()}};
  ins.push(i);r.appendChild(i);b.appendChild(r)})(p)}
 var go=el("button","btn","Tarkista");go.onclick=finish;b.appendChild(go);
 var fe=ins.filter(function(i){return !i.value})[0]||ins[0];if(fe)fe.focus()}
function resultView(b,d){var t=d.test,n=t.order.length,ok=t.res.filter(function(r){return r===1}).length;
 var c=el("div","tq");c.appendChild(el("div","big",ok+" / "+n+" oikein ("+Math.round(ok/n*100)+" %)"));
 var bs=el("div","r"),wrong=[];t.res.forEach(function(r,p){if(r===0)wrong.push(t.order[p])});
 var nw=el("button","btn","Uusi testi");nw.onclick=function(){tSetup=true;renderTest()};bs.appendChild(nw);
 if(wrong.length){var wb=el("button","btn","Testaa väärät uudelleen");wb.onclick=function(){wrongFlow(d,t)};bs.appendChild(wb)}
 c.appendChild(bs);b.appendChild(c);
 rng(n).sort(function(a,z){return (t.res[a]===1)-(t.res[z]===1)||a-z}).forEach(function(p){
  var good=t.res[p]===1,r=el("div","tq");r.appendChild(el("div","tw",(good?"✓ ":"✗ ")+tQ(d,t,p)));
  var l=el("div",good?"t-ok":"t-bad",good?(t.ans[p]||""):("Vastasit: "+(t.ans[p]||"–")+" · Oikea: "+tA(d,t,p)));r.appendChild(l);b.appendChild(r)})}
$("tst").onclick=function(){flush();openTest()};
$("tback").onclick=function(){tFlush();$("test").hidden=true;$("prac").hidden=false;render()};

init();
